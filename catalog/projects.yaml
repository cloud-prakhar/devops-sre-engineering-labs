# Machine-readable catalog of all 45 projects (15 themes x 3 clouds).
# Source of truth for status. docs/progress/implementation-tracker.md is generated from it:
#   python3 scripts/catalog.py tracker --write
# Validate after every change:
#   python3 scripts/catalog.py validate
#
# free_tier.fit is an assessment against each provider's free offer at the time of writing, not a
# guarantee. Free-tier terms differ by account age and plan; always check your own account.
schema_version: 1
status_values:
  planned: Designed in this catalog; no files yet
  implemented: Code, docs, ADRs, cost, troubleshooting and interview material exist; static checks pass
  deployment-tested: Deployed to the real cloud, verify script passed, and cleaned up (recorded with date)
validation_values:
  passed: check ran and passed
  failed: check ran and failed
  not-run: check not run
  not-tested: never deployed to the cloud
  n/a: check does not apply
