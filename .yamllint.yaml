extends: default
ignore: |
  **/node_modules/
  **/.terraform/
  # Helm templates are Go templates, not YAML; scripts/validate.sh helm lints and renders them.
  shared/helm-charts/*/templates/
  projects/*/*/gitops/*/templates/
rules:
  line-length: { max: 140 }
  document-start: disable
  truthy: { check-keys: false }
  comments: { min-spaces-from-content: 1 }
  braces: { max-spaces-inside: 1 }
  indentation: { spaces: consistent, indent-sequences: whatever }
