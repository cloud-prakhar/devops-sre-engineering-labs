apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.name" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "taskboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
