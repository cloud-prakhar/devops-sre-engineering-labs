<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Taskboard</h1>
      <p id="info" class="muted">connecting…</p>
    </header>
    <form id="new-task">
      <input id="title" name="title" maxlength="200" placeholder="New task" required>
      <button type="submit">Add</button>
    </form>
    <ul id="tasks"></ul>
    <p id="error" class="error" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
