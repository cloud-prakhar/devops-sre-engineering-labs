apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard
  namespace: taskboard
data:
  # Each pod keeps its own SQLite file on an emptyDir: fine for learning Deployments, wrong for real
  # data (replicas disagree, data dies with the pod). AWS 10 moves state to a StatefulSet.
  DATABASE_URL: sqlite:////data/taskboard.db
  LOG_LEVEL: INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskboard
        app.kubernetes.io/version: dev   # set to the release tag by scripts/deploy-workloads.sh
    spec:
      automountServiceAccountToken: false   # the app never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over AZs (nodes carry topology.kubernetes.io/zone).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: taskboard
      containers:
        - name: api
          image: taskboard-api   # replaced by kustomize (scripts/deploy-workloads.sh) with an ECR digest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskboard
          env:
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard
  namespace: taskboard
spec:
  type: ClusterIP   # reached with kubectl port-forward here; AWS 08 adds an Ingress / load balancer
  selector:
    app.kubernetes.io/name: taskboard
  ports:
    - name: http
      port: 80
      targetPort: http
