# Bounded CPU load for the HPA drill: 4 workers x 10 minutes of requests to /api/tasks, then it stops.
# Apply: kubectl apply -f k8s/drills/load-generator.yaml ; remove: kubectl delete -f ...
apiVersion: batch/v1
kind: Job
metadata:
  name: load-generator
  namespace: taskboard
spec:
  parallelism: 4
  completions: 4
  backoffLimit: 0
  activeDeadlineSeconds: 660
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: busybox:1.37
          command: [sh, -c]
          args:
            - end=$(( $(date +%s) + 600 ));
              while [ "$(date +%s)" -lt "$end" ]; do
                wget -q -O /dev/null http://taskboard.taskboard.svc.cluster.local/api/tasks || true;
              done
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
