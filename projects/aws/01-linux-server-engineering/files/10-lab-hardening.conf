# /etc/ssh/sshd_config.d/10-lab-hardening.conf
# sshd keeps the FIRST value it reads for most keywords, and drop-ins are read in lexical
# order. The "10-" prefix makes these settings win over Ubuntu's 50-/60-cloudimg files.
# Verify the effective result with:  sudo sshd -T | grep -Ei 'passwordauth|permitroot|allowgroups'

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Only members of ssh-users may log in. A new user needs: usermod -aG ssh-users <user>
AllowGroups ssh-users

MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60

# Local forwarding stays enabled for the API tunnel (ssh -L); everything else is off.
AllowTcpForwarding local
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no

ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
