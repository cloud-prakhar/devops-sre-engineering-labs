# Reverse proxy: TLS termination, routing, rate limiting, timeouts.

# Docker's embedded DNS. Resolving upstream names at request time (via variables below) means
# a recreated container with a new IP is found within 10 s instead of returning 502 until
# nginx is reloaded.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
  '"upstream":"$upstream_addr","urt":"$upstream_response_time"}';
access_log /dev/stdout json;

server_tokens off;

# Plain HTTP: health check for the container, everything else redirects to HTTPS.
server {
    listen 8080;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TLS:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS is deliberately not sent: browsers ignore it for self-signed certificates and IP
    # addresses, and a wrong HSTS policy on a real domain is hard to undo.

    client_max_body_size 64k;

    set $api_upstream      http://api:8000;
    set $frontend_upstream http://frontend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;
    proxy_send_timeout    10s;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $api_upstream;
    }

    # External readiness check for the whole path proxy -> api -> db.
    location = /readyz {
        access_log off;
        proxy_pass $api_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
    }
}
