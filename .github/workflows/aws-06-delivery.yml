# AWS 06 delivery pipeline: test -> build -> scan -> (approval) push to ECR + provenance -> deploy by digest.
#
# Without AWS set up, only the "verify" job runs (on PRs and pushes that touch the app): tests, image
# build, vulnerability gate and SBOM. Release and deploy run only when started by hand
# (workflow_dispatch), only when the repository variable AWS06_ENABLED is "true", and only inside the
# "aws-06-lab" GitHub Environment, whose required reviewers approve each run.
# See projects/aws/06-secure-cicd-container-registry/README.md.
name: aws-06-delivery

on:
  pull_request:
    paths:
      - shared/sample-apps/taskboard/api/**
      - .github/workflows/aws-06-delivery.yml
  push:
    branches: [main]
    paths:
      - shared/sample-apps/taskboard/api/**
      - .github/workflows/aws-06-delivery.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the new image to the AWS 06 host after pushing it
        type: boolean
        default: true
      rollback:
        description: Skip the build and redeploy the previously running digest
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a running release or deploy half-way; queue the next run instead.
concurrency:
  group: aws-06-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: shared/sample-apps/taskboard/api
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  LOCAL_IMAGE: taskboard-api:${{ github.sha }}

jobs:
  verify:
    name: Test, build, scan, SBOM
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt
      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build image
        run: docker build --build-arg "APP_VERSION=${GITHUB_SHA}" -t "$LOCAL_IMAGE" "$APP_DIR"
      - name: Vulnerability gate (fixable HIGH/CRITICAL fail the build)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --timeout 15m "$LOCAL_IMAGE"
      - name: SBOM (CycloneDX)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY_IMAGE"
          image --format cyclonedx --output /out/sbom.cdx.json --timeout 15m "$LOCAL_IMAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30

  release:
    name: Push to ECR with provenance
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && vars.AWS06_ENABLED == 'true' && !inputs.rollback }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: aws-06-lab
    permissions:
      contents: read
      id-token: write       # OIDC token for AWS
      attestations: write  # build provenance + SBOM attestations
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      REPOSITORY: ${{ vars.AWS06_ECR_REPOSITORY_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS06_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS06_REGION }}
          role-session-name: gha-release-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build
        run: docker build --build-arg "APP_VERSION=${GITHUB_SHA}" -t "$REPOSITORY:$GITHUB_SHA" "$APP_DIR"
      - name: Vulnerability gate on the exact image being pushed
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --timeout 15m "$REPOSITORY:$GITHUB_SHA"
      - name: SBOM
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY_IMAGE"
          image --format cyclonedx --output /out/sbom.cdx.json --timeout 15m "$REPOSITORY:$GITHUB_SHA"
      - name: Push (immutable tag = commit SHA)
        id: push
        run: |
          docker push "$REPOSITORY:$GITHUB_SHA"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY:$GITHUB_SHA")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ vars.AWS06_ECR_REPOSITORY_URL }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ vars.AWS06_ECR_REPOSITORY_URL }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: ECR scan-on-push result (CRITICAL fails)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          repo_name=${REPOSITORY#*/}
          aws ecr wait image-scan-complete --repository-name "$repo_name" --image-id "imageDigest=$DIGEST"
          counts=$(aws ecr describe-image-scan-findings --repository-name "$repo_name" --image-id "imageDigest=$DIGEST" \
            --query 'imageScanFindings.findingSeverityCounts' --output json)
          echo "ECR basic scan: $counts" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $(jq -r '.CRITICAL // 0' <<<"$counts") == 0 ]]

  deploy:
    name: Deploy by digest via SSM
    needs: [verify, release]
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' && vars.AWS06_ENABLED == 'true' &&
          (inputs.rollback || (inputs.deploy && needs.release.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: aws-06-lab
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ vars.AWS06_INSTANCE_ID }}
      IMAGE: ${{ needs.release.outputs.image }}
      ROLLBACK: ${{ inputs.rollback }}
      SSM_RUN: projects/aws/06-secure-cicd-container-registry/scripts/ssm-run.sh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS06_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS06_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}
      - name: Deploy (health-gated, automatic rollback on the host)
        run: |
          if [[ "$ROLLBACK" == true ]]; then
            "$SSM_RUN" "$INSTANCE_ID" "taskboard-deploy --rollback"
          else
            [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "not a digest reference: $IMAGE"; exit 1; }
            "$SSM_RUN" "$INSTANCE_ID" "taskboard-deploy $IMAGE"
          fi
      - name: Verify the running version from inside the host
        run: |
          out=$("$SSM_RUN" "$INSTANCE_ID" "curl -fsS http://127.0.0.1/api/info; echo; taskboard-deploy --status" 120)
          echo "$out"
          if [[ "$ROLLBACK" != true ]]; then
            grep -q "\"version\":\"${GITHUB_SHA}\"" <<<"$out" || { echo "running version is not ${GITHUB_SHA}"; exit 1; }
          fi
          { echo '### Deployed'; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
