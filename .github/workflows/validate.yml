# Static validation for every push and pull request.
# Never deploys to a cloud and never uses cloud credentials.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  terraform:
    name: Terraform fmt, validate, tflint, trivy, cloud-init schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ hashFiles('**/.terraform.lock.hcl') }}
      - run: scripts/validate.sh terraform cloudinit

  lint:
    name: Shell, Dockerfile, YAML, Compose, Mermaid, links, catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/mermaid/package-lock.json
      - run: pip install --disable-pip-version-check yamllint==1.37.1 pyyaml==6.0.2
      - run: scripts/validate.sh shell docker yaml compose mermaid links catalog

  app:
    name: Taskboard unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: shared/sample-apps/taskboard/api/requirements-dev.txt
      - run: pip install -r shared/sample-apps/taskboard/api/requirements-dev.txt
      - run: scripts/validate.sh app

  local-tests:
    name: Container tests (local Docker, no cloud)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, app]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: projects/aws/02-dockerized-app-on-vm/scripts/local-test.sh
      - run: projects/aws/03-multi-service-docker-app/scripts/local-test.sh

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1
          git --redact --no-banner --exit-code 1 /repo
